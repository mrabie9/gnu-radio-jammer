id: gpsk_comms_keyboard_command_source
label: Keyboard Command Source
category: '[gpsk_comms]'
flags: [show_id, python]

parameters:
- id: gui_hint
  label: GUI Hint
  dtype: gui_hint
  hide: part

outputs:
- domain: message
  id: command
  optional: false

templates:
  imports: from gpsk_comms.keyboard_command_source import keyboard_command_source
  make: |-
    <%
        win = '_%s_win' % id
    %>\
    ${win} = keyboard_command_source()
    self.${id} = ${win}
    ${gui_hint() % win}

documentation: |-
  Qt keyboard and on-screen button controller for GMSK Command TX.

  Hold W, A, S, or D to publish forward, left, backward, or right command
  dictionaries. Space publishes stop. Releasing all controls publishes a
  release message so a TX block configured with Send Only While Pressed stops
  command frames. While held, the source re-arms the active command every
  100 ms so receivers/controllers that require repeated movement updates keep
  moving. A short release debounce handles Windows key-repeat events; losing
  application focus releases all controls immediately.

  This block must be used in a QT GUI flowgraph.

file_format: 1
